name: wf-develop-deploy
on:
  push:
   branches:
     -develop
jobs: 
 wf-develop-build-job:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Repo
     uses: actions/checkout@v4
   - name: Build Website
     run: |
       npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
   - name: Upload Artifacts
     uses: actions/upload-pages-artifact@v3
     with: 
       path: "./dist"
       name: "develop-artifact"
wf-develop-deploy-job:
 needs: wf-develop-build-job
 permission:
   pages: write
   id-token: write
  environment: "deloypment evn"
  runs-on: ubuntu-latest
  steps:
   - name: Deploy Build Artifacts on Gh Pages
     uses: actions/deploy-pages@v4
     with:
       artifact-name: "develop-artifact"
       token: ${{github.token}}
       

  